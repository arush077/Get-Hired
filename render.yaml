services:
  # Node.js backend — Interview + Resume + Auth
  - type: web
    name: get-hired
    runtime: node
    rootDir: backend-node
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://get-hired-weld.vercel.app
      - key: NODE_VERSION
        value: 24.0.0
