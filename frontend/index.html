<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="card">
    <h1>Interview Platform</h1>

    <section id="setup-section">
      <h2>Start Interview</h2>
      <div class="controls">
        <label for="voice-select">Voice:</label>
        <select id="voice-select"></select>
      </div>
      <div class="controls">
        <label for="speed-slider">Speed:</label>
        <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0" />
        <span id="speed-value">1.0x</span>
      </div>
      <form id="setup-form">
        <label for="candidate-name">Candidate Name</label>
        <input type="text" id="candidate-name" required placeholder="e.g. John Doe" />

        <label for="job-role">Job Role</label>
        <input type="text" id="job-role" required placeholder="e.g. Software Engineer" />

        <button type="submit">Start Interview</button>
      </form>
    </section>

    <section id="interview-section" hidden>
      <p class="q-count" id="q-count"></p>
      <p id="question-text"></p>
      <span class="status" id="status" data-state="idle">Idle</span>

      <div class="transcript" id="transcript" hidden></div>

      <div class="actions">
        <button id="start-answer-btn" hidden>Start Answering</button>
        <button id="finish-btn" hidden>Finish Answer</button>
      </div>
    </section>

    <section id="results-section" hidden>
      <h2>Interview Results</h2>
      <div id="results-list"></div>
      <button id="restart-btn">Start New Interview</button>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
