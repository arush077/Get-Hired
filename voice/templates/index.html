<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Interview</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="card">
    <h1>Voice Interview Prototype</h1>

    <div class="controls">
      <label for="voice-select">Voice:</label>
      <select id="voice-select"></select>
      <button id="start-btn">Start Interview</button>
    </div>

    <p class="q-count" id="q-count"></p>
    <p id="question-text"></p>
    <span class="status" id="status" data-state="idle">Idle</span>

    <div class="transcript" id="transcript" hidden></div>

    <div class="actions">
      <button id="finish-btn" hidden>Finish Answer</button>
    </div>

    <section id="results-section" hidden>
      <h2>Interview Results</h2>
      <div id="results-list"></div>
      <button id="restart-btn">Start New Interview</button>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
